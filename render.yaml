services:
  - type: web
    name: erp-api
    runtime: node
    plan: free
    buildCommand: npm install --production --legacy-peer-deps
    startCommand: node src/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: erp-api
      - key: JWT_AUDIENCE
        value: erp-api
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: ADMIN_EMAIL
        value: admin@erp.local
      - key: ADMIN_PASSWORD
        generateValue: true
    healthCheckPath: /api/v1/health

databases:
  - name: erp-db
    plan: free
    databaseName: erp
    ipAllowList: []
